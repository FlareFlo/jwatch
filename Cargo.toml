[package]
name = "jwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.13"
color-eyre = "0.6.5"
indicatif = "0.18.0"
rusqlite = "0.37.0"
time = { version = "0.3.44", features = ["local-offset"] }
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ctrlc = "3.5.2"
# Already in the tree via indicatif; used directly for TTY-aware colouring
console = "0.16.1"

[dev-dependencies]
tempfile = "3"
